<text x="24" y="24" font-size="14" fill="#1f2937" font-weight="600" text-anchor="start" opacity="1">BVH：自顶向下递归地把图元分成两组</text><rect x="24" y="40" width="330" height="330" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" opacity="1"/><line x1="56" y1="156" x2="96" y2="182" stroke="#c2410c" stroke-width="1.7" opacity="0.95" stroke-linecap="round"/><line x1="78" y1="210" x2="128" y2="226" stroke="#c2410c" stroke-width="1.7" opacity="0.95" stroke-linecap="round"/><line x1="52" y1="262" x2="104" y2="276" stroke="#c2410c" stroke-width="1.7" opacity="0.95" stroke-linecap="round"/><line x1="110" y1="150" x2="132" y2="206" stroke="#c2410c" stroke-width="1.7" opacity="0.95" stroke-linecap="round"/><line x1="96" y1="288" x2="140" y2="300" stroke="#c2410c" stroke-width="1.7" opacity="0.95" stroke-linecap="round"/><line x1="150" y1="232" x2="186" y2="252" stroke="#c2410c" stroke-width="1.7" opacity="0.95" stroke-linecap="round"/><line x1="214" y1="96" x2="268" y2="122" stroke="#c2410c" stroke-width="1.7" opacity="0.95" stroke-linecap="round"/><line x1="246" y1="148" x2="296" y2="164" stroke="#c2410c" stroke-width="1.7" opacity="0.95" stroke-linecap="round"/><line x1="232" y1="196" x2="286" y2="214" stroke="#c2410c" stroke-width="1.7" opacity="0.95" stroke-linecap="round"/><line x1="186" y1="62" x2="220" y2="84" stroke="#c2410c" stroke-width="1.7" opacity="0.95" stroke-linecap="round"/><line x1="252" y1="226" x2="292" y2="244" stroke="#c2410c" stroke-width="1.7" opacity="0.95" stroke-linecap="round"/><line x1="176" y1="268" x2="214" y2="286" stroke="#c2410c" stroke-width="1.7" opacity="0.95" stroke-linecap="round"/><line x1="286" y1="96" x2="322" y2="118" stroke="#c2410c" stroke-width="1.7" opacity="0.95" stroke-linecap="round"/><line x1="214" y1="320" x2="258" y2="336" stroke="#c2410c" stroke-width="1.7" opacity="0.95" stroke-linecap="round"/><g class="b1" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.12;0.18;0.9;0.96;1" dur="15s" repeatCount="indefinite" calcMode="linear"/><rect x="47" y="57" width="280" height="284" rx="2" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" opacity="1"/><text x="47" y="50" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start" opacity="1">根包围盒</text></g><g class="b2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.36;0.9;0.96;1" dur="15s" repeatCount="indefinite" calcMode="linear"/><rect x="51" y="57" width="276" height="162" rx="2" fill="none" stroke="#2563eb" stroke-width="1.5" opacity="1"/><rect x="47" y="205" width="250" height="136" rx="2" fill="none" stroke="#2563eb" stroke-width="1.5" opacity="1"/></g><g class="b3" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.48;0.54;0.9;0.96;1" dur="15s" repeatCount="indefinite" calcMode="linear"/><rect x="51" y="57" width="174" height="154" rx="2" fill="none" stroke="#ea580c" stroke-width="1.5" opacity="1"/><rect x="209" y="91" width="118" height="128" rx="2" fill="none" stroke="#ea580c" stroke-width="1.5" opacity="1"/><rect x="47" y="205" width="98" height="100" rx="2" fill="none" stroke="#ea580c" stroke-width="1.5" opacity="1"/><rect x="145" y="221" width="152" height="120" rx="2" fill="none" stroke="#ea580c" stroke-width="1.5" opacity="1"/><rect x="51" y="151" width="50" height="36" rx="2" fill="none" stroke="#059669" stroke-width="1.5" opacity="1"/><rect x="105" y="57" width="120" height="154" rx="2" fill="none" stroke="#059669" stroke-width="1.5" opacity="1"/><rect x="209" y="91" width="118" height="36" rx="2" fill="none" stroke="#059669" stroke-width="1.5" opacity="1"/><rect x="227" y="143" width="74" height="76" rx="2" fill="none" stroke="#059669" stroke-width="1.5" opacity="1"/><rect x="73" y="205" width="60" height="26" rx="2" fill="none" stroke="#059669" stroke-width="1.5" opacity="1"/><rect x="47" y="257" width="98" height="48" rx="2" fill="none" stroke="#059669" stroke-width="1.5" opacity="1"/><rect x="145" y="227" width="74" height="64" rx="2" fill="none" stroke="#059669" stroke-width="1.5" opacity="1"/><rect x="209" y="221" width="88" height="120" rx="2" fill="none" stroke="#059669" stroke-width="1.5" opacity="1"/></g><g class="c1" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.12;0.18;0.9;0.96;1" dur="15s" repeatCount="indefinite" calcMode="linear"/><circle cx="396" cy="92" r="9" fill="#475569" opacity="0.14"/><circle cx="396" cy="92" r="9" fill="none" stroke="#475569" stroke-width="1.2"/><text x="396" y="96" font-size="11" fill="#475569" font-weight="600" text-anchor="middle" opacity="1">1</text><text x="414" y="96" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start" opacity="1">先用一个包围盒包住所有图元</text></g><g class="c2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.36;0.9;0.96;1" dur="15s" repeatCount="indefinite" calcMode="linear"/><circle cx="396" cy="148" r="9" fill="#2563eb" opacity="0.14"/><circle cx="396" cy="148" r="9" fill="none" stroke="#2563eb" stroke-width="1.2"/><text x="396" y="152" font-size="11" fill="#2563eb" font-weight="600" text-anchor="middle" opacity="1">2</text><text x="414" y="152" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start" opacity="1">按 SAH 代价选轴与位置，一分为二</text></g><g class="c2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.36;0.9;0.96;1" dur="15s" repeatCount="indefinite" calcMode="linear"/><text x="414" y="176" font-size="11" fill="#64748b" font-weight="400" text-anchor="start" opacity="1">代价 ≈ 遍历代价 + Σ(面积比 × 子节点代价)</text></g><g class="c3" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.48;0.54;0.9;0.96;1" dur="15s" repeatCount="indefinite" calcMode="linear"/><circle cx="396" cy="232" r="9" fill="#059669" opacity="0.14"/><circle cx="396" cy="232" r="9" fill="none" stroke="#059669" stroke-width="1.2"/><text x="396" y="236" font-size="11" fill="#059669" font-weight="600" text-anchor="middle" opacity="1">3</text><text x="414" y="236" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start" opacity="1">递归划分，直到叶节点只剩少量图元</text></g><g class="c3" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.48;0.54;0.9;0.96;1" dur="15s" repeatCount="indefinite" calcMode="linear"/><text x="414" y="260" font-size="11" fill="#64748b" font-weight="400" text-anchor="start" opacity="1">包围盒允许重叠，但每个图元只有一个归属</text></g><text x="396" y="312" font-size="11" fill="#64748b" font-weight="400" text-anchor="start" opacity="1">查询时先用射线与父包围盒求交：不命中就整棵剪枝，</text><text x="396" y="332" font-size="11" fill="#64748b" font-weight="400" text-anchor="start" opacity="1">命中后再按“近的子节点优先”深入，尽快收紧命中距离。</text><text x="396" y="374" font-size="11" fill="#64748b" font-weight="400" text-anchor="start" opacity="1">这正是 GPU 硬件光追遍历（RT Core）所依赖的结构。</text></svg>