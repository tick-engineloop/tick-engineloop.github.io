<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 316" width="720" height="316">
<style>text { font-family: 'Segoe UI',Roboto,'Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif; }</style>
<rect width="720" height="316" fill="#ffffff"/>
<text x="30" y="26" font-size="14" fill="#1f2937" font-weight="600" text-anchor="start" opacity="1">空间划分 Space Partitioning</text><text x="30" y="44" font-size="11" fill="#64748b" font-weight="400" text-anchor="start" opacity="1">空间被切成互不重叠的单元；图元可能跨越单元而被切开</text><rect x="30" y="58" width="280" height="180" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" opacity="1"/><rect x="30" y="58" width="140" height="90" rx="0" fill="#eff6ff" stroke="#94a3b8" stroke-width="1" opacity="1"/><rect x="200" y="148" width="70" height="45" rx="0" fill="#eff6ff" stroke="#94a3b8" stroke-width="1" opacity="1"/><rect x="240" y="58" width="70" height="90" rx="0" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" opacity="1"/><line x1="170.0" y1="58" x2="170.0" y2="238" stroke="#94a3b8" stroke-width="1" opacity="1" stroke-linecap="round"/><line x1="30" y1="148.0" x2="310" y2="148.0" stroke="#94a3b8" stroke-width="1" opacity="1" stroke-linecap="round"/><line x1="100" y1="58" x2="100" y2="148.0" stroke="#94a3b8" stroke-width="1" opacity="1" stroke-linecap="round"/><line x1="30" y1="103" x2="170.0" y2="103" stroke="#94a3b8" stroke-width="1" opacity="1" stroke-linecap="round"/><line x1="240" y1="148.0" x2="240" y2="238" stroke="#94a3b8" stroke-width="1" opacity="1" stroke-linecap="round"/><line x1="240" y1="193" x2="310" y2="193" stroke="#94a3b8" stroke-width="1" opacity="1" stroke-linecap="round"/><line x1="205" y1="148.0" x2="205" y2="193" stroke="#94a3b8" stroke-width="1" opacity="1" stroke-linecap="round"/><line x1="170.0" y1="170.5" x2="240" y2="170.5" stroke="#94a3b8" stroke-width="1" opacity="1" stroke-linecap="round"/><polygon points="150,118 230,98 200,178" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.2" opacity="1" stroke-linejoin="round"/><text x="236" y="102" font-size="10.5" fill="#1d4ed8" font-weight="400" text-anchor="start" opacity="1">跨越单元的图元</text><polygon points="94,188 112,210 88,214" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.1" opacity="1" stroke-linejoin="round"/><polygon points="76,216 94,238 70,242" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.1" opacity="1" stroke-linejoin="round"/><polygon points="266,84 284,106 260,110" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.1" opacity="1" stroke-linejoin="round"/><polygon points="288,118 306,140 282,144" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.1" opacity="1" stroke-linejoin="round"/><polygon points="100,82 118,104 94,108" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.1" opacity="1" stroke-linejoin="round"/><polygon points="170,120 188,142 164,146" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.1" opacity="1" stroke-linejoin="round"/><text x="30" y="262" font-size="11" fill="#64748b" font-weight="400" text-anchor="start" opacity="1">· 单元互不重叠，空间被完全划分</text><text x="30" y="282" font-size="11" fill="#64748b" font-weight="400" text-anchor="start" opacity="1">· 图元可能被切开，或被多个单元引用</text><text x="30" y="302" font-size="11" fill="#64748b" font-weight="400" text-anchor="start" opacity="1">· 代表：BSP、kd-tree、四叉树、八叉树、均匀网格</text><text x="400" y="26" font-size="14" fill="#1f2937" font-weight="600" text-anchor="start" opacity="1">对象划分 Object Partitioning</text><text x="400" y="44" font-size="11" fill="#64748b" font-weight="400" text-anchor="start" opacity="1">把图元分组，用包围盒包住；包围盒之间可以重叠</text><rect x="394" y="50" width="296" height="196" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3" opacity="1"/><rect x="400" y="66" width="132" height="76" rx="3" fill="rgba(37,99,235,0.07)" stroke="#2563eb" stroke-width="1.4" opacity="1"/><rect x="504" y="100" width="100" height="66" rx="3" fill="rgba(234,88,12,0.07)" stroke="#ea580c" stroke-width="1.4" opacity="1"/><rect x="408" y="150" width="100" height="82" rx="3" fill="rgba(5,150,105,0.07)" stroke="#059669" stroke-width="1.4" opacity="1"/><rect x="558" y="140" width="120" height="100" rx="3" fill="rgba(124,58,237,0.07)" stroke="#7c3aed" stroke-width="1.4" opacity="1"/><polygon points="444,80 466,96 452.8,97.6" fill="#fdba74" stroke="#c2410c" stroke-width="1.1" opacity="1" stroke-linejoin="round"/><polygon points="474,108 508,124 487.6,135.2" fill="#fdba74" stroke="#c2410c" stroke-width="1.1" opacity="1" stroke-linejoin="round"/><polygon points="524,82 542,98 531.2,96.4" fill="#fdba74" stroke="#c2410c" stroke-width="1.1" opacity="1" stroke-linejoin="round"/><polygon points="550,118 576,134 560.4,138.8" fill="#fdba74" stroke="#c2410c" stroke-width="1.1" opacity="1" stroke-linejoin="round"/><polygon points="424,170 454,186 436.0,194.0" fill="#fdba74" stroke="#c2410c" stroke-width="1.1" opacity="1" stroke-linejoin="round"/><polygon points="456,200 476,216 464.0,216.0" fill="#fdba74" stroke="#c2410c" stroke-width="1.1" opacity="1" stroke-linejoin="round"/><polygon points="586,166 620,182 599.6,193.2" fill="#fdba74" stroke="#c2410c" stroke-width="1.1" opacity="1" stroke-linejoin="round"/><polygon points="614,204 636,220 622.8,221.6" fill="#fdba74" stroke="#c2410c" stroke-width="1.1" opacity="1" stroke-linejoin="round"/><text x="394" y="262" font-size="11" fill="#64748b" font-weight="400" text-anchor="start" opacity="1">· 包围盒可以互相重叠，但图元保持完整、不被切开</text><text x="394" y="282" font-size="11" fill="#64748b" font-weight="400" text-anchor="start" opacity="1">· 每个图元只属于一个叶节点，便于动态更新（refit）</text><text x="394" y="302" font-size="11" fill="#64748b" font-weight="400" text-anchor="start" opacity="1">· 代表：BVH、R-tree、包围球层次、TLAS/BLAS</text><line x1="366" y1="52" x2="366" y2="302" stroke="#e2e8f0" stroke-width="1" opacity="1" stroke-linecap="round"/></svg>